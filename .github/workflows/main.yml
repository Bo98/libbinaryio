name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Lint
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        with:
          style: ''
          tidy-checks: ''
          version: 19
          verbosity: debug
          extra-args: -std=c++20

      - name: Fail
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1

  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        build_type:
          - Debug
          - Release 
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export CMAKE_GENERATOR=Ninja
          fi
          cmake -S. -Bbuild \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_VERIFY_INTERFACE_HEADER_SETS=ON \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build
          cmake --build build --target all_verify_interface_header_sets
          cmake --install build

      - uses: actions/upload-artifact@v6
        with:
          name: binaryio-${{ matrix.build_type }}-${{ matrix.os }}
          path: install/*
